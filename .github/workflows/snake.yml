name: Generate Snake

on:
  schedule:
    # Запускается каждые 6 часов
    - cron: "0 */6 * * *"
  # Позволяет запускать Action вручную с вкладки Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Обновлено до v4
      - uses: actions/checkout@v4

      # Генерация змейки
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: Amir21020
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Показ статуса для отладки
      - run: git status

      # Пуш изменений в ветку main
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: true

      # Публикация в ветку output
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}